name: Deploy
# Deploys only to mortyyjt.site. The likes service is deployed and checked
# before the static export, so new pages never depend on a missing API.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: 1
      - name: Build the likes image
        run: |
          docker build -f services/likes/Dockerfile -t "mortyyjt-likes:$GITHUB_SHA" .
          docker save "mortyyjt-likes:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/likes-image.tar.gz"
      - name: Deploy the likes service
        env:
          LIKES_KEY: ${{ secrets.LIKES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIKES_KEY" > ~/.ssh/likes_key
          chmod 600 ~/.ssh/likes_key
          echo '43.161.224.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPKbzBXsAcPGNv/E2VbXleXLwINIpTLzXFunG+hysZTB' >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/likes_key -o IdentitiesOnly=yes -o BatchMode=yes \
            ubuntu@43.161.224.82 "deploy-likes $GITHUB_SHA" < "$RUNNER_TEMP/likes-image.tar.gz"
          curl --fail --retry 3 https://mortyyjt.site/api/likes
      - name: Upload the export
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          # The server's host key, pinned instead of trusted on first use.
          echo '43.161.224.82 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPKbzBXsAcPGNv/E2VbXleXLwINIpTLzXFunG+hysZTB' >> ~/.ssh/known_hosts
          # The server-side key runs rrsync confined to /srv/mortyyjt.site, so "/" is that directory.
          # --delay-updates swaps files in at the end, so a visitor never gets new HTML before its assets.
          # Old hashed assets are protected from --delete: a visitor holding a cached page from the
          # previous build can still load its CSS and JS.
          rsync -rlt --checksum --delete --delay-updates \
            --filter='P /_next/static/**' \
            -e "ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes" \
            out/ ubuntu@43.161.224.82:/
